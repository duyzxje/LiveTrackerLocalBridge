name: Release Application

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi push tag dạng v1.0.0, v1.0.1, v2.0.0,...

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: true

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        # -H=windowsgui giúp ẩn cửa sổ console đen khi chạy trên Windows
        run: |
          go build -ldflags="-s -w -H=windowsgui" -o livetracker-windows-amd64.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: livetracker-windows-amd64.exe

  build-macos:
    name: Build MacOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          cache: true

      - name: Build Binary (Intel)
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o livetracker-macos-amd64 .

      - name: Build Binary (Apple Silicon)
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w" -o livetracker-macos-arm64 .

      - name: Package macOS binaries
        run: |
          zip -r livetracker-macos-amd64.zip livetracker-macos-amd64
          zip -r livetracker-macos-arm64.zip livetracker-macos-arm64

      - name: Upload Artifact (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: macos-amd64-zip
          path: livetracker-macos-amd64.zip

      - name: Upload Artifact (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-zip
          path: livetracker-macos-arm64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: .

      - name: Download MacOS Intel Zip
        uses: actions/download-artifact@v4
        with:
          name: macos-amd64-zip
          path: .

      - name: Download MacOS Apple Silicon Zip
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-zip
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            livetracker-windows-amd64.exe
            livetracker-macos-amd64.zip
            livetracker-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
